<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Teachers</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="brand">AMS</div>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="students.html">👨‍🎓 Students</a>

   class="active">

</aside>


<main class="main-content">

<header class="topbar">

<h2>Teacher Management</h2>

</header>


<section class="content">

<div class="card">

<div class="card-header">

<h3>Teachers</h3>

<button class="primary-btn"
        onclick="showTeacherForm()">
+ Add Teacher
</button>

</div>


<div id="teacherForm"
     class="form-panel"
     style="display:none">

<input id="teacherId"
       placeholder="Teacher ID">

<input id="teacherName"
       placeholder="Teacher Name">

<input id="teacherDepartment"
       placeholder="Department">

<input id="teacherSubject"
       placeholder="Subject">

<button class="success-btn"
        onclick="addTeacher()">
Save Teacher
</button>

</div>


<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Department</th>
<th>Subject</th>
<th>Action</th>

</tr>

</thead>

<tbody id="teacherTable">

</tbody>

</table>

</div>

</section>

</main>

</div>

<script src="script.js"></script>

<script>

loadTeachers();

</script>

</body>

</html>
