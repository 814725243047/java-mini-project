<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Attendance</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="brand">AMS</div>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="students.html">👨‍🎓 Students</a>
<a href="teachers.html">👨‍🏫 Teachers</a>
<a href="subjects.html">📚 Subjects</a>

<a href="attendance.html"
   class="active">
   ✅ Attendance
</a>

<a href="records.html">📋 Records</a>
<a href="reports.html">📊 Reports</a>
<a href="index.html">🚪 Logout</a>

</aside>


<main class="main-content">

<header class="topbar">

<h2>Take Attendance</h2>

</header>


<section class="content">

<div class="card">

<div class="attendance-controls">

<div>

<label>Date</label>

<input type="date"
       id="attendanceDate">

</div>


<div>

<label>Subject</label>

<select id="attendanceSubject">
</select>

</div>


<div>

<label>Class</label>

<select id="attendanceClass">

<option>
AI & DS - A
</option>

<option>
AI & DS - B
</option>

</select>

</div>

</div>


<div class="card-header">

<h3>Student Attendance</h3>

<div>

<button class="success-btn"
        onclick="markAllPresent()">
All Present
</button>

<button class="danger-btn"
        onclick="markAllAbsent()">
All Absent
</button>

</div>

</div>


<table>

<thead>

<tr>

<th>ID</th>
<th>Name</th>
<th>Class</th>
<th>Status</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>


<br>

<button class="primary-btn"
        onclick="saveAttendance()">
Save Attendance
</button>

</div>

</section>

</main>

</div>

<script src="script.js"></script>

<script>

loadAttendancePage();

</script>

</body>

</html>
