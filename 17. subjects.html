<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Subjects</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="layout">

<aside class="sidebar">

<div class="brand">AMS</div>

<a href="dashboard.html">🏠 Dashboard</a>
<a href="students.html">👨‍🎓 Students</a>

<main class="main-content">

<header class="topbar">

<h2>Subject Management</h2>

</header>


<section class="content">

<div class="card">

<div class="card-header">

<h3>Subjects</h3>

<button class="primary-btn"
        onclick="showSubjectForm()">
+ Add Subject
</button>

</div>


<div id="subjectForm"
     class="form-panel"
     style="display:none">

<input id="subjectCode"
       placeholder="Subject Code">

<input id="subjectName"
       placeholder="Subject Name">

<input id="subjectDepartment"
       placeholder="Department">

<button class="success-btn"
        onclick="addSubject()">
Save Subject
</button>

</div>


<table>

<thead>

<tr>

<th>Code</th>
<th>Subject</th>
<th>Department</th>
<th>Action</th>

</tr>

</thead>

<tbody id="subjectTable">

</tbody>

</table>

</div>

</section>

</main>

</div>

<script src="script.js"></script>

<script>

loadSubjects();

</script>

</body>

</html>
