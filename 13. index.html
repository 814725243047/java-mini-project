<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Management System</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            AMS
        </div>

        <h1>Attendance Management System</h1>

        <p class="subtitle">
            Administrator Login
        </p>

        <form id="loginForm">

            <label>Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit"
                    class="primary-btn">
                Login
            </button>

        </form>

        <p id="loginMessage"
           class="message">
        </p>

        <div class="demo-login">

            Demo Login<br>

            Username:
            <b>admin</b>

            <br>

            Password:
            <b>admin123</b>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
